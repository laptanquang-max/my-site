<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="周万里的个人作品集 · 产品设计、AI 与可持续设计。" />
  <title>周万里 · 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    // 在内容绘制前恢复主题；存储不可用时仍可正常切换。
    try { document.body.classList.toggle('dark', localStorage.getItem('portfolio-theme') === 'dark'); } catch (_) {}
  </script>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header class="site-header">
    <nav aria-label="主导航">
      <a href="index.html" aria-current="page">首页</a>
      <a href="works.html">作品</a>
      <a href="about.html">关于</a>
    </nav>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false">🌙</button>
  </header>
  <main>
    <h1>周万里</h1>
    <p>产品设计专业 · 在学 AI 和可持续设计</p>
    <div class="mark">MADE WITH AI · 我的第一个页面</div>
  </main>
  <script src="particles.js"></script>
  <script>
    const toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      toggle.textContent = dark ? '☀️' : '🌙';
      toggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      toggle.setAttribute('aria-pressed', String(dark));
    }
    applyTheme(document.body.classList.contains('dark'));
    toggle.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark');
      applyTheme(dark);
      try { localStorage.setItem('portfolio-theme', dark ? 'dark' : 'light'); } catch (_) {}
    });
    window.addEventListener('storage', (event) => {
      if (event.key === 'portfolio-theme') applyTheme(event.newValue === 'dark');
    });
  </script>
</body>
</html>
