<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="联系周万里 · 邮箱地址。" />
  <title>周万里 · 联系</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    // 在内容绘制前恢复主题；存储不可用时仍可正常切换。
    try { document.body.classList.toggle('dark', localStorage.getItem('portfolio-theme') === 'dark'); } catch (_) {}
  </script>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header class="site-header">
    <nav aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="works.html">作品</a>
      <a href="about.html">关于</a>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false"><span class="icon" aria-hidden="true">🌙</span><span class="tip" role="tooltip">切换深色</span></button>
      <a class="contact-link" href="contact.html" aria-label="联系我 · 查看邮箱">
        <span class="icon-cloud" aria-hidden="true">☁️</span><span class="icon-star" aria-hidden="true">⭐</span>
        <span class="tip" role="tooltip">联系我 · 查看邮箱</span>
      </a>
    </div>
  </header>
  <main>
    <p class="eyebrow">联系</p>
    <h1>找我聊聊</h1>
    <div class="page-content contact-list">
      <p>如果你对我的作品感兴趣，欢迎写邮件给我：</p>
      <p><a class="email" href="mailto:laptanquang@gmail.com">laptanquang@gmail.com</a></p>
      <p><a class="email" href="mailto:kj21499347761@163.com">kj21499347761@163.com</a></p>
    </div>
  </main>
  <script src="particles.js"></script>
  <script>
    const toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      toggle.querySelector('.icon').textContent = dark ? '☀️' : '🌙';
      toggle.querySelector('.tip').textContent = dark ? '切换浅色' : '切换深色';
      toggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      toggle.setAttribute('aria-pressed', String(dark));
    }
    applyTheme(document.body.classList.contains('dark'));
    toggle.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark');
      applyTheme(dark);
      try { localStorage.setItem('portfolio-theme', dark ? 'dark' : 'light'); } catch (_) {}
    });
    window.addEventListener('storage', (event) => {
      if (event.key === 'portfolio-theme') applyTheme(event.newValue === 'dark');
    });
  </script>
</body>
</html>
