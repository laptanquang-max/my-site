  <script>
    // 在内容绘制前恢复主题；存储不可用时仍可正常切换。
    try { document.body.classList.toggle('dark', localStorage.getItem('portfolio-theme') === 'dark'); } catch (_) {}
  </script>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header class="site-header">

      <a class="contact-link" href="contact.html" aria-label="联系我 · 查看邮箱">
        <span class="icon-cloud" aria-hidden="true">☁️</span><span class="icon-star" aria-hidden="true">⭐</span>
        <span class="tip" role="tooltip">联系我 · 查看邮箱</span>
      </a>
    </div>
  </header>
  <main class="works-page">
    <p class="eyebrow">作品</p>

    <section class="page-content project" aria-labelledby="zero-limit-title">
      <img class="project-hero" src="images/zero-limit/page-01.jpg" width="1600" height="900" alt="零界赛后修复拖鞋主图：白色流线鞋身、绿色鞋床与镂空结构" fetchpriority="high" />
      <div class="project-intro">
        <h2 id="zero-limit-title">零界</h2>
        <p>运动员赛后修复拖鞋 —— 让激烈比赛之后的双脚，立刻松弛下来。</p>
      </div>
      <div class="project-gallery">
        <img src="images/zero-limit/page-03.jpg" width="1600" height="900" alt="零界效果图：运动员在更衣室穿着拖鞋，展示赛后换鞋与放松场景" loading="lazy" decoding="async" />
        <img src="images/zero-limit/page-06.jpg" width="1600" height="900" alt="零界效果图：流线鞋身的设计草图、材质参考与产品造型" loading="lazy" decoding="async" />
        <img src="images/zero-limit/page-09.jpg" width="1600" height="900" alt="零界穿着细节：赛后脱下运动鞋、换上拖鞋并进行放松拉伸" loading="lazy" decoding="async" />
      </div>
    </section>

      <img class="project-hero" src="images/work-2.jpg" width="1055" height="1491" alt="隅翼卫浴花洒整体结构：墙角双翼花洒展开与折叠状态、控台和置物架" loading="lazy" decoding="async" />

        <img src="images/work-3.jpg" width="1055" height="1491" alt="隅翼附件细节展示：花洒折叠收纳、控台操作、双翼展开及手持花洒模式切换" loading="lazy" decoding="async" />

    </section>

      <div class="project-intro">
        <h2 id="cloud-jelly-title">云母</h2>
        <p>云母 · 睡前舒压助眠产品 —— 帮你在睡前松开一天紧绷的神经，安稳入睡。</p>
      </div>
    </section>
  </main>
  <script src="particles.js"></script>
  <script>
    const toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      toggle.querySelector('.icon').textContent = dark ? '☀️' : '🌙';
      toggle.querySelector('.tip').textContent = dark ? '切换浅色' : '切换深色';
      toggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      toggle.setAttribute('aria-pressed', String(dark));
    }
    applyTheme(document.body.classList.contains('dark'));
    toggle.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark');
      applyTheme(dark);
      try { localStorage.setItem('portfolio-theme', dark ? 'dark' : 'light'); } catch (_) {}
    });
    window.addEventListener('storage', (event) => {
      if (event.key === 'portfolio-theme') applyTheme(event.newValue === 'dark');
    });
  </script>
</body>
</html>
